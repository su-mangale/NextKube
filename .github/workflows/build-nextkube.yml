name: Build NextKube App

on:
  push:
    branches:
      - production
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-nextkube.yml'
      - '.github/workflows/_reusable-build.yml'
      - '!**/*.md'
      - '!docs/**'
      - '!**/.gitignore'
      - '!**/.prettierrc'
      - '!**/.eslintrc*'
  pull_request:
    branches:
      - production
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-nextkube.yml'
      - '.github/workflows/_reusable-build.yml'
      - '!**/*.md'
      - '!docs/**'
      - '!**/.gitignore'
      - '!**/.prettierrc'
      - '!**/.eslintrc*'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/_reusable-build.yml
    with:
      app_name: nextkube
      dockerfile_path: Dockerfile
      image_name: nextkube
      platforms: "linux/arm64"
    secrets: inherit
